name: Deploy Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Web MVP smoke test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('standalone.html', 'utf8');
          if (!html.includes('<canvas id="world">')) throw new Error('Missing game canvas');
          if (!html.includes('function boot()')) throw new Error('Missing boot function');
          if (/<script[^>]+src=/.test(html)) throw new Error('Standalone MVP must not depend on external scripts');
          const start = html.indexOf('<script>');
          const end = html.lastIndexOf('</script>');
          if (start < 0 || end <= start) throw new Error('Missing inline runtime');
          const js = html.slice(start + 8, end);
          new Function(js);
          for (const id of ['world','clock','loc','money','energy','stress','rel','modal','story','choices','hour','save','load','error']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing UI element: ${id}`);
          }
          console.log('Web MVP smoke test: PASS');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Web deployment trigger verified after GitHub Pages was enabled.
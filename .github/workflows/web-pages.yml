name: Deploy Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare pinned CC0 GLB test fixture
        run: |
          mkdir -p assets/dev-fixtures
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/programasweights/avatar/e225eee89835d121876b15bf4c887dc20d357950/public/assets/character.glb \
            --output assets/dev-fixtures/quaternius-superhero-male.glb
          python3 - <<'PY'
          from pathlib import Path
          import struct
          path = Path("assets/dev-fixtures/quaternius-superhero-male.glb")
          data = path.read_bytes()
          assert data[:4] == b"glTF", "Fixture is not a GLB file"
          assert struct.unpack_from("<I", data, 4)[0] == 2, "Expected glTF 2.0"
          assert struct.unpack_from("<I", data, 8)[0] == len(data), "GLB length mismatch"
          assert len(data) > 100_000, "Fixture download looks incomplete"
          print(f"GLB fixture verified: {len(data)} bytes")
          PY
      - name: Prepare candidate everyday human characters
        run: |
          mkdir -p assets/characters/candidates
          BASE=https://raw.githubusercontent.com/KingArthur207/kite/5716dcc99c3f00391ea67d8ca080529d195d2889/sim/public/models
          curl --fail --location --silent --show-error "$BASE/ped_man.glb" --output assets/characters/candidates/minh-base-ped-man.glb
          curl --fail --location --silent --show-error "$BASE/ped_casual_woman.glb" --output assets/characters/candidates/linh-base-casual-woman.glb
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          for path in Path("assets/characters/candidates").glob("*.glb"):
              data = path.read_bytes()
              assert data[:4] == b"glTF", f"{path} is not a GLB file"
              assert struct.unpack_from("<I", data, 4)[0] == 2, f"{path} is not glTF 2.0"
              assert struct.unpack_from("<I", data, 8)[0] == len(data), f"{path} length mismatch"
              assert len(data) > 100_000, f"{path} download looks incomplete"
              json_length, chunk_type = struct.unpack_from("<II", data, 12)
              assert chunk_type == 0x4E4F534A, f"{path} first chunk must be JSON"
              doc = json.loads(data[20:20+json_length].decode("utf-8").rstrip(" \\t\\r\\n\\0"))
              assert doc.get("skins"), f"{path} has no skinned humanoid rig"
              assert max((len(s.get("joints", [])) for s in doc["skins"]), default=0) >= 20, f"{path} skeleton is unexpectedly small"
              assert doc.get("meshes"), f"{path} has no visible mesh"
              print(f"Candidate rig verified: {path} ({len(data)} bytes, {len(doc['skins'])} skin(s), {len(doc.get('animations', []))} animation(s))")
          PY
      - name: Set up character generation toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch pinned Ara 3D Gen character generator
        run: |
          GENERATOR_DIR="$RUNNER_TEMP/ara3dgen"
          git clone --filter=blob:none https://github.com/olatunde85/3d-gen.git "$GENERATOR_DIR"
          git -C "$GENERATOR_DIR" fetch --depth 1 origin a4947ffdd14acf2ff018cb3568c941595f86d86e
          git -C "$GENERATOR_DIR" checkout --detach a4947ffdd14acf2ff018cb3568c941595f86d86e
      - name: Cache CC0 MakeHuman source and generated library
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ara3dgen/vendor
            ${{ runner.temp }}/ara3dgen/public/assets
            ${{ runner.temp }}/ara3dgen/node_modules
          key: ara3dgen-assets-a4947ffdd14acf2ff018cb3568c941595f86d86e-v1
      - name: Install Ara 3D Gen dependencies and CC0 assets
        run: |
          GENERATOR_DIR="$RUNNER_TEMP/ara3dgen"
          npm install --prefix "$GENERATOR_DIR"
          npm --prefix "$GENERATOR_DIR" run setup-assets
      - name: Generate Minh and Linh production-quality character GLBs
        run: |
          mkdir -p assets/characters/generated
          GENERATOR_DIR="$RUNNER_TEMP/ara3dgen"
          cat > "$GENERATOR_DIR/scripts/export-life-sim.ts" <<'TS'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { buildHuman } from '../src/core/human';
          import { DEFAULT_PARAMS } from '../src/core/params';
          import { triangleCount } from '../src/core/mesh';
          import { planExport, runExport } from '../src/export';
          import { nodeLibrary } from './node-assets';
          const value = (key: string) => {
            const index = process.argv.indexOf('--' + key);
            return index < 0 ? undefined : process.argv[index + 1];
          };
          const paramsPath = value('params');
          const out = value('out') ?? 'out';
          if (!paramsPath) throw new Error('Missing --params');
          const params = { ...DEFAULT_PARAMS, ...JSON.parse(readFileSync(paramsPath, 'utf8')) };
          const lib = await nodeLibrary();
          const character = await buildHuman(lib, params);
          const plan = planExport(character, {
            mode: 'animated',
            format: 'glb',
            clips: ['idle', 'walk', 'run'],
            packaging: 'embedded',
            clipMesh: false,
            rootMotion: false,
            loopSuffix: false,
            weaponFile: 'held'
          });
          const file = await runExport(lib, character, plan);
          mkdirSync(out, { recursive: true });
          writeFileSync(join(out, file.name), file.data);
          console.log(`${params.name}: ${triangleCount(character.mesh)} triangles, three gameplay clips, ${(file.data.length / 1e6).toFixed(1)} MB -> ${file.name}`);
          TS
          "$GENERATOR_DIR/node_modules/.bin/tsx" "$GENERATOR_DIR/scripts/export-life-sim.ts" --params "$GITHUB_WORKSPACE/assets/characters/source/minh.params.json" --out "$GITHUB_WORKSPACE/assets/characters/generated"
          "$GENERATOR_DIR/node_modules/.bin/tsx" "$GENERATOR_DIR/scripts/export-life-sim.ts" --params "$GITHUB_WORKSPACE/assets/characters/source/linh.params.json" --out "$GITHUB_WORKSPACE/assets/characters/generated"
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          for name in ("Minh", "Linh"):
              path = Path(f"assets/characters/generated/{name}.glb")
              data = path.read_bytes()
              assert data[:4] == b"glTF", f"{name}: invalid GLB"
              assert struct.unpack_from("<I", data, 4)[0] == 2, f"{name}: expected glTF 2.0"
              assert struct.unpack_from("<I", data, 8)[0] == len(data), f"{name}: GLB length mismatch"
              length, kind = struct.unpack_from("<II", data, 12)
              assert kind == 0x4E4F534A, f"{name}: missing JSON chunk"
              doc = json.loads(data[20:20+length].decode("utf-8").rstrip(" \\t\\r\\n\\0"))
              assert doc.get("skins") and max(len(s.get("joints", [])) for s in doc["skins"]) >= 60, f"{name}: expected game humanoid rig"
              assert doc.get("animations"), f"{name}: animations missing"
              assert len(doc["animations"]) == 3, f"{name}: expected only idle/walk/run gameplay clips"
              names = [a.get("name", "").lower() for a in doc["animations"]]
              assert any("idle" in n for n in names), f"{name}: idle clip missing"
              assert any("walk" in n for n in names), f"{name}: walk clip missing"
              assert any("run" in n for n in names), f"{name}: run clip missing"
              assert doc.get("images"), f"{name}: embedded skin/clothing textures missing"
              assert len(doc.get("materials", [])) <= 32, f"{name}: too many material slots"
              tris = sum((doc["accessors"][p["indices"]]["count"] // 3) for mesh in doc.get("meshes", []) for p in mesh.get("primitives", []) if "indices" in p)
              assert 12000 <= tris <= 50000, f"{name}: triangle count {tris} outside medium-detail target"
              print(f"{name}: {len(data)/1e6:.1f} MB, {tris} triangles, {len(doc['skins'][0]['joints'])} bones, {len(names)} clips, {len(doc['images'])} images")
          PY
      - name: Validate Three.js asset pipeline
        run: |
          node --check src/three-character-pipeline.mjs
          node --check src/three-world-adapter.mjs
          node --check src/three-character-overlay.mjs
          node --check tests/character-candidates-browser.mjs
          node --check tests/game-three-overlay-browser.mjs
          node tests/asset-pipeline.test.mjs
      - name: Browser render test for candidate characters
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tests/character-candidates-browser.mjs
      - name: Upload candidate character screenshot
        uses: actions/upload-artifact@v4
        with:
          name: character-candidate-review
          path: artifacts/character-candidates.png
          if-no-files-found: error
      - name: Upload generated production character review screenshot
        uses: actions/upload-artifact@v4
        with:
          name: generated-character-review
          path: artifacts/character-production-review.png
          if-no-files-found: error
      - name: Browser test the live game with imported main characters
        run: node tests/game-three-overlay-browser.mjs
      - name: Upload gameplay character overlay screenshot
        uses: actions/upload-artifact@v4
        with:
          name: game-three-character-overlay
          path: artifacts/game-three-character-overlay.png
          if-no-files-found: error
      - name: Web 3D smoke test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web.html', 'utf8');
          const js = fs.readFileSync('src/web3d_v5.js', 'utf8');
          const characters = fs.readFileSync('src/character-system.js', 'utf8');
          for (const id of ['world','clock','loc','money','energy','stress','rel','modal','story','choices','hour','save','load','error']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing UI element: ${id}`);
          }
          if (!html.includes('src="src/character-system.js')) throw new Error('Missing character system script');
          if (!html.includes('src="src/web3d_v5.js')) throw new Error('Missing active Web 3D runtime script');
          if (!js.includes('getContext("webgl"')) throw new Error('Missing WebGL runtime');
          if (!js.includes('function interact()')) throw new Error('Missing interaction system');
          if (!js.includes('canvas.addEventListener("mousedown"')) throw new Error('Missing mouse camera control');
          if (!js.includes('function updateNPC')) throw new Error('Missing NPC simulation');
          if (!js.includes('function startFallback(reason)')) throw new Error('Missing 2D compatibility renderer');
          if (!js.includes('function sphereData(') || !js.includes('function ellipsoid(')) throw new Error('Missing detailed 3D mesh renderer');
          if (!js.includes('function person(n,type)') || !js.includes('function parkProps()')) throw new Error('Missing character/environment renderer');
          const runtimeStart = js.indexOf('(()=>{"use strict";');
          if (runtimeStart < 0 || js.indexOf('function street(){') < runtimeStart || js.indexOf('function draw(') < runtimeStart) throw new Error('Scene renderer and WebGL draw helpers must share runtime scope');

          if (js.split('function building(p)').length !== 2) throw new Error('Duplicate building renderer overrides detailed environment');
          if (!js.includes('const visualScale=n.visualScale||1')) throw new Error('Missing visible character scaling');
          if (!js.includes('"Minh · Bạn"') || !js.includes('"Linh"')) throw new Error('Missing on-screen main character labels');
          if (!js.includes('camYaw=.35,camPitch=.34,camDist=5.4')) throw new Error('Opening camera must frame the main characters');
          if (!js.includes('x:-21.8,z:14.0') || !js.includes('x:-26.2,z:14.0')) throw new Error('Main characters must start separated and visible');

          if (!js.includes('vNor=normalize(mat3(uModel)*aNor)')) throw new Error('Missing transformed character normals');
          if (!js.includes('createShader returned null')) throw new Error('Missing WebGL allocation diagnostics');
          if (!js.includes('requestAnimationFrame(fallbackTick)')) throw new Error('Missing fallback simulation loop');
          new Function(characters);
          new Function(js);
          require('./tests/character-system.test.js');
          console.log('Web 3D + Character System smoke test: PASS');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Một Đời Người — Life Simulation</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b252e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 6px #000}.top{display:flex;justify-content:space-between;padding:16px 20px 8px;font-weight:800}.chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 20px}.chip,#hint,.btn{background:#071018d9;border:1px solid #ffffff24;border-radius:9px;padding:7px 10px}.chip{font-size:12px}.bottom{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);white-space:nowrap}.controls{position:fixed;right:16px;bottom:16px;display:flex;gap:7px;pointer-events:auto}.btn{color:#fff;cursor:pointer}.btn:hover{background:#172530}.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);padding:9px 13px;border-radius:10px;background:#071018ed;color:#fff;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:end center;padding:24px;z-index:10}.card{width:min(760px,100%);background:#101820f7;color:#fff;border:1px solid #ffffff25;border-radius:18px;padding:22px;box-shadow:0 20px 70px #000a}.meta{font-size:12px;font-weight:800;opacity:.6}.text{font-size:19px;line-height:1.5;margin:10px 0 17px}.choices{display:grid;gap:8px}.choice{border:1px solid #ffffff22;background:#ffffff0b;color:#fff;border-radius:10px;padding:12px;text-align:left;cursor:pointer;font-size:14px}.choice:hover{background:#ffffff18}.error{position:fixed;inset:0;display:none;place-items:center;background:#121a22;color:#fff;padding:25px;z-index:99}.error .box{max-width:760px;background:#1b2630;padding:22px;border-radius:16px}.error pre{white-space:pre-wrap;color:#ffd7d7;font-size:12px}@media(max-width:700px){.bottom{white-space:normal;text-align:center;width:calc(100% - 30px)}.controls{right:10px;bottom:58px}}</style></head><body><canvas id="world"></canvas><div id="hud"><div class="top"><div>MỘT ĐỜI NGƯỜI</div><div id="clock"></div></div><div class="chips"><span class="chip">Nguyễn Minh · 24</span><span class="chip" id="loc"></span><span class="chip" id="money"></span><span class="chip" id="energy"></span><span class="chip" id="stress"></span><span class="chip" id="rel"></span></div><div class="bottom" id="hint">WASD di chuyển · E tương tác · N +1 giờ · P lưu · L tải · R chơi lại</div></div><div class="toast" id="toast"></div><div class="controls"><button class="btn" id="hour">+1 giờ</button><button class="btn" id="save">Lưu</button><button class="btn" id="load">Tải</button></div><div class="modal" id="modal"><div class="card"><div class="meta" id="meta"></div><div class="text" id="story"></div><div class="choices" id="choices"></div></div></div><div class="error" id="error"><div class="box"><h2>Web MVP gặp lỗi khởi động</h2><p>Trang đã mở nhưng bộ mô phỏng không chạy.</p><pre id="errorText"></pre></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('world'),ctx=c.getContext('2d'),clock=$('clock'),loc=$('loc'),money=$('money'),energy=$('energy'),stress=$('stress'),rel=$('rel'),modal=$('modal'),meta=$('meta'),story=$('story'),choices=$('choices'),toastEl=$('toast');const SAVE_KEY='motdoinguoi-web-mvp-v2',DAYS=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];const DEFAULT={day:1,min:462,money:15000000,energy:82,stress:18,confidence:52,trust:0,affection:0,understanding:0,closeness:0,respect:0,hurt:0,memories:[],done:[]};const state=structuredClone(DEFAULT),player={x:-420,y:-240},keys=new Set();let paused=false,last=performance.now(),toastTimer=0;const places=[['Nhà',-520,-330,220,150,'#71899a'],['Văn phòng',270,-330,280,170,'#627b8d'],['Quán cà phê',-520,240,190,140,'#96715b'],['Công viên',280,220,250,170,'#5f8060'],['Cửa hàng',-70,235,190,135,'#a9905e'],['Nhà hàng',-70,-340,190,135,'#875e5d']];const roads=[[-760,-70,1520,120],[-80,-620,160,1240]],linh={x:-430,y:300};const npcs=Array.from({length:18},(_,i)=>({x:-680+(i*137)%1360,y:-560+(i*83)%1120,vx:Math.sin(i*2.3)*.45,vy:Math.cos(i*1.7)*.45}));const scenes=[[1,'Nhà','Sáng Chủ nhật. Điện thoại nằm trên bàn. Minh không có kế hoạch rõ ràng.',[['Ở nhà nghỉ ngơi',{energy:6,stress:-3,m:'rested'}],['Đi ra ngoài',{energy:-3,m:'went_out'}]]],[1,'Quán cà phê','Quán cà phê không đông. Có những buổi sáng chẳng có chuyện gì đặc biệt.',[['Ngồi một mình',{energy:2,stress:-1,m:'quiet_cafe'}],['Mở lời',{energy:-2,confidence:2,m:'small_talk'}]]],[2,'Văn phòng','Một việc gấp xuất hiện đúng lúc Minh vừa định đóng máy.',[['Ở lại xử lý',{energy:-8,stress:5,m:'worked_late'}],['Để sáng mai',{stress:-2,m:'set_boundary'}]]],[2,'Nhà','Một tin nhắn của Linh xuất hiện. Chỉ là một câu hỏi rất bình thường.',[['Trả lời ngay',{energy:-1,trust:2,affection:2,m:'replied'}],['Để mai',{trust:-1,m:'delayed'}]]],[3,'Văn phòng','Đồng nghiệp rủ Minh đi ăn trưa. Cậu đã định ăn một mình.',[['Đi cùng',{energy:-4,confidence:1,m:'lunch'}],['Từ chối',{energy:2,m:'alone'}]]],[3,'Công viên','Công viên yên hơn thường lệ. Minh có thời gian nghĩ về tuần này.',[['Đi bộ',{energy:-2,stress:-5,m:'walk'}],['Về nhà',{energy:2,m:'home_early'}]]],[4,'Quán cà phê','Linh có vẻ mệt nhưng vẫn cố tỏ ra bình thường.',[['Hỏi thăm',{trust:2,understanding:3,affection:1,m:'noticed'}],['Không hỏi',{hurt:2,affection:-1,m:'missed_signal'}]]],[5,'Cửa hàng','Một khoản chi nhỏ cũng là một lựa chọn.',[['Mua thứ mình thích',{money:-80000,stress:-2,m:'small_treat'}],['Không mua',{confidence:1,m:'saved'}]]],[5,'Nhà hàng','Một lời mời ăn tối đến bất ngờ.',[['Đi ăn',{money:-180000,energy:-3,affection:2,closeness:2,m:'dinner'}],['Từ chối',{energy:2,trust:-1,m:'declined'}]]],[6,'Văn phòng','Cuối tuần đã gần tới nhưng một phần việc vẫn chưa xong.',[['Làm thêm',{energy:-5,stress:4,m:'overtime'}],['Đóng máy đúng giờ',{stress:-3,confidence:1,m:'protected_time'}]]],[6,'Quán cà phê','Linh hỏi: “Dạo này cậu ổn không?”',[['Nói thật một chút',{trust:4,understanding:4,closeness:2,confidence:2,m:'opened_up'}],['Nói “ổn mà”',{trust:-1,m:'kept_feelings'}]]],[7,'Nhà','Sáng thứ Bảy. Minh có thể dành cả ngày cho việc riêng.',[['Ngủ thêm',{energy:8,stress:-3,m:'slept'}],['Dọn phòng',{energy:-2,confidence:1,m:'cleaned'}]]],[7,'Công viên','Mỗi người trong công viên đều có một cuộc sống riêng. Minh cũng vậy.',[['Ngồi quan sát',{energy:2,stress:-3,understanding:1,m:'observed'}],['Đi bộ thật lâu',{energy:-5,stress:-6,m:'long_walk'}]]],[7,'Quán cà phê','Linh nhắn rằng hôm nay cô ấy rảnh. Không có kế hoạch đặc biệt nào.',[['Hẹn gặp',{energy:-3,affection:2,closeness:3,trust:2,m:'made_time'}],['Để dịp khác',{energy:2,trust:-2,m:'postponed'}]]],[7,'Nhà hàng','Bữa tối kết thúc. Có những mối quan hệ không cần một câu trả lời ngay lập tức.',[['Muốn tiếp tục tìm hiểu',{trust:3,affection:3,closeness:2,m:'said_continue'}],['Giữ như hiện tại',{m:'status_quo'}]]],[2,'Cửa hàng','Minh ghé mua đồ ăn trước khi về. Một người quen tình cờ đứng cùng hàng.',[['Chào hỏi',{confidence:1,trust:1,m:'greeted'}],['Im lặng',{m:'quiet_shop'}]]],[4,'Công viên','Một buổi chiều rảnh bất ngờ. Minh có thể dùng nó cho chính mình.',[['Ngồi nghe nhạc',{stress:-4,energy:2,m:'music'}],['Nhắn cho Linh',{affection:1,trust:1,m:'checked_in'}]]],[5,'Văn phòng','Minh nhận ra mình đã ôm quá nhiều việc trong vài ngày.',[['Xin hỗ trợ',{stress:-3,confidence:2,m:'asked_help'}],['Tự làm hết',{energy:-6,stress:4,m:'did_all'}]]],[6,'Nhà','Tối thứ Sáu. Căn phòng yên. Minh nghĩ về những người mình đã gặp trong tuần.',[['Nhắn một câu hỏi thăm',{trust:2,affection:1,m:'sent_care'}],['Tắt điện thoại',{stress:-2,m:'offline'}]]],[7,'Cửa hàng','Cuối tuần. Minh phải quyết định khoản tiền nào đáng để chi.',[['Mua đồ cần thiết',{money:-120000,confidence:1,m:'planned_spend'}],['Để tuần sau',{confidence:1,m:'deferred_spend'}]]]];
function resize(){c.width=Math.max(320,innerWidth);c.height=Math.max(240,innerHeight)}function clamp(v){return Math.max(0,Math.min(100,v))}function moneyFmt(v){return new Intl.NumberFormat('vi-VN').format(Math.round(v))+' ₫'}function time(){const m=((Math.floor(state.min)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function place(){let best=['Đường phố',Infinity];for(const p of places){const cx=p[1]+p[3]/2,cy=p[2]+p[4]/2,d=Math.hypot(player.x-cx,player.y-cy);if(d<best[1])best=[p[0],d]}return best[1]<175?best[0]:'Đường phố'}function relationship(){return Math.round((state.trust+state.affection+state.understanding+state.closeness+state.respect)/5)}function hud(){clock.textContent=`${DAYS[state.day-1]} · ${time()}`;loc.textContent=place();money.textContent=moneyFmt(state.money);energy.textContent=`Năng lượng ${Math.round(state.energy)}`;stress.textContent=`Stress ${Math.round(state.stress)}`;rel.textContent=`Quan hệ ${relationship()}`}function toast(t){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),1800)}function keyFor(s){return `${s.id||s[0]}`}function openScene(s){if(!s)return toast('Ở đây chưa có sự kiện mới.');paused=true;meta.textContent=`${s[1]} · ${DAYS[state.day-1]} · ${time()}`;story.textContent=s[2];choices.innerHTML='';s[3].forEach(ch=>{const b=document.createElement('button');b.className='choice';b.textContent=ch[0];b.onclick=()=>choose(ch[1],s);choices.appendChild(b)});modal.style.display='grid'}function applyEffect(e){for(const k of ['energy','stress','confidence','trust','affection','understanding','closeness','respect','hurt'])if(Number.isFinite(e[k]))state[k]=clamp(state[k]+e[k]);if(Number.isFinite(e.money))state.money=Math.max(0,state.money+e.money)}function choose(e,s){applyEffect(e);if(e.m)state.memories.push({id:e.m,day:state.day,min:state.min});state.done.push(`${state.day}|${keyFor(s)}`);advanceTime(12,false);modal.style.display='none';paused=false;hud();toast('Lựa chọn đã được ghi nhớ.')}function sceneDone(s){return state.done.includes(`${state.day}|${keyFor(s)}`)}function interact(){const here=place(),s=scenes.find(x=>x[0]===state.day&&x[1]===here&&!sceneDone(x));if(s)return openScene(s);if(here==='Quán cà phê'&&Math.hypot(player.x-linh.x)<150)return openScene([`linh-${state.day}`,'Quán cà phê','Linh nhìn Minh rồi mỉm cười nhẹ. Hôm nay cô ấy không vội.',[['Hỏi hôm nay thế nào',{trust:1,understanding:1,m:'asked'}],['Kể một chuyện nhỏ',{affection:1,closeness:1,m:'shared'}],['Để cô ấy nghỉ',{respect:1,m:'space'}]]]);toast('Ở đây chưa có sự kiện mới.')}function advanceTime(minutes,manual=true){state.min+=minutes;while(state.min>=1440){state.min-=1440;state.day++;state.done=[];if(state.day>7){endWeek();return}}if(manual)state.energy=clamp(state.energy-1);setLinhPosition();hud()}function setLinhPosition(){if(state.day<=1){linh.x=-430;linh.y=300}else if(state.day<=4){linh.x=360;linh.y=-240}else{linh.x=-420;linh.y=300}}function hour(){if(paused)return;advanceTime(60,true)}function endWeek(){state.day=7;state.min=1380;paused=true;meta.textContent='KẾT THÚC TUẦN 01';let t='Một tuần bình thường.';if(state.trust>=60&&state.affection>=60&&state.closeness>=45)t='Một người đang trở nên quan trọng.';else if(state.trust<20||state.hurt>=30)t='Khoảng cách bắt đầu xuất hiện.';else if(state.stress>=70)t='Minh cần chậm lại.';story.textContent=t+' Không có đúng hay sai tuyệt đối. Chỉ có những lựa chọn đã trở thành một phần của cuộc sống.';choices.innerHTML='';const b=document.createElement('button');b.className='choice';b.textContent='Chơi lại từ đầu';b.onclick=reset;choices.appendChild(b);modal.style.display='grid'}function serial(){return {version:2,state:JSON.parse(JSON.stringify(state)),player:{...player},linh:{...linh},npcs:npcs.map(n=>({...n}))}}function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(serial()));toast('Đã lưu cuộc sống của Minh.')}catch(e){toast('Không thể lưu trên trình duyệt này.')}}function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(!d||!d.state)return toast('Chưa có bản lưu.');Object.assign(state,DEFAULT,d.state);Object.assign(player,d.player||{x:-420,y:-240});Object.assign(linh,d.linh||{});if(Array.isArray(d.npcs))d.npcs.forEach((n,i)=>{if(npcs[i])Object.assign(npcs[i],n)});paused=false;modal.style.display='none';hud();toast('Đã tải bản lưu.')}catch(e){toast('Bản lưu không hợp lệ.')}}function reset(){localStorage.removeItem(SAVE_KEY);location.reload()}function update(dt){if(!paused){let vx=(keys.has('d')?1:0)-(keys.has('a')?1:0),vy=(keys.has('s')?1:0)-(keys.has('w')?1:0);if(vx||vy){const q=Math.hypot(vx,vy);player.x+=vx/q*210*dt;player.y+=vy/q*210*dt;state.min+=dt*.6;while(state.min>=1440){state.min-=1440;state.day++;state.done=[];if(state.day>7){endWeek();break}}setLinhPosition();hud()}}for(const n of npcs){n.x+=n.vx*35*dt;n.y+=n.vy*35*dt;if(Math.abs(n.x)>720||Math.abs(n.y)>600){n.vx=-n.vx;n.vy=-n.vy}if(Math.random()<.006){n.vx=Math.max(-.7,Math.min(.7,n.vx+(Math.random()-.5)*.3));n.vy=Math.max(-.7,Math.min(.7,n.vy+(Math.random()-.5)*.3))}}}function draw(){ctx.fillStyle='#60725c';ctx.fillRect(0,0,c.width,c.height);const ox=player.x-c.width/2,oy=player.y-c.height/2,sx=v=>v-ox,sy=v=>v-oy;for(const r of roads){ctx.fillStyle='#30343a';ctx.fillRect(sx(r[0]),sy(r[1]),r[2],r[3])}ctx.strokeStyle='#d6c05b';ctx.lineWidth=3;ctx.setLineDash([20,20]);ctx.beginPath();ctx.moveTo(sx(-760),sy(-10));ctx.lineTo(sx(760),sy(-10));ctx.moveTo(sx(0),sy(-620));ctx.lineTo(sx(0),sy(620));ctx.stroke();ctx.setLineDash([]);for(const p of places){ctx.fillStyle=p[5];ctx.fillRect(sx(p[1]),sy(p[2]),p[3],p[4]);ctx.fillStyle='#071018c0';ctx.fillRect(sx(p[1]+8),sy(p[2]+8),Math.min(p[3]-16,190),26);ctx.fillStyle='#fff';ctx.font='700 13px system-ui';ctx.fillText(p[0],sx(p[1]+15),sy(p[2]+27))}for(const n of npcs){ctx.fillStyle='#687786';ctx.beginPath();ctx.arc(sx(n.x),sy(n.y),7,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#e0b08e';ctx.beginPath();ctx.arc(sx(linh.x),sy(linh.y),11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText('Linh',sx(linh.x-13),sy(linh.y-18));ctx.fillStyle='#2f3740';ctx.beginPath();ctx.arc(sx(player.x),sy(player.y),13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 12px system-ui';ctx.fillText('Minh',sx(player.x-15),sy(player.y-20));requestAnimationFrame(draw)}function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);requestAnimationFrame(loop)}function boot(){resize();addEventListener('resize',resize);addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','e','n','p','l','r'].includes(k))e.preventDefault();keys.add(k);if(k==='e')interact();if(k==='n')hour();if(k==='p')save();if(k==='l')load();if(k==='r')reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));$('hour').onclick=hour;$('save').onclick=save;$('load').onclick=load;hud();setLinhPosition();requestAnimationFrame(loop);requestAnimationFrame(draw)}try{boot()}catch(e){$('errorText').textContent=e&&e.stack?e.stack:String(e);$('error').style.display='grid'}})();</script></body></html>

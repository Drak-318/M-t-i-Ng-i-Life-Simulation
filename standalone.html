<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Một Đời Người — Web MVP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b252e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 6px #000}.top{display:flex;justify-content:space-between;padding:16px 20px 8px;font-weight:800}.chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 20px}.chip,#hint,.btn{background:#071018d9;border:1px solid #ffffff24;border-radius:9px;padding:7px 10px}.chip{font-size:12px}.bottom{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);white-space:nowrap}.controls{position:fixed;right:16px;bottom:16px;display:flex;gap:7px;pointer-events:auto}.btn{color:#fff;cursor:pointer}.btn:hover{background:#172530}.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);padding:9px 13px;border-radius:10px;background:#071018ed;color:#fff;opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:end center;padding:24px;z-index:10}.card{width:min(760px,100%);background:#101820f7;color:#fff;border:1px solid #ffffff25;border-radius:18px;padding:22px;box-shadow:0 20px 70px #000a}.meta{font-size:12px;font-weight:800;opacity:.6}.text{font-size:19px;line-height:1.5;margin:10px 0 17px}.choices{display:grid;gap:8px}.choice{border:1px solid #ffffff22;background:#ffffff0b;color:#fff;border-radius:10px;padding:12px;text-align:left;cursor:pointer;font-size:14px}.choice:hover{background:#ffffff18}.error{position:fixed;inset:0;display:none;place-items:center;background:#121a22;color:#fff;padding:25px;z-index:99}.error .box{max-width:760px;background:#1b2630;padding:22px;border-radius:16px}.error pre{white-space:pre-wrap;color:#ffd7d7;font-size:12px}@media(max-width:700px){.bottom{white-space:normal;text-align:center;width:calc(100% - 30px)}.controls{right:10px;bottom:58px}}</style></head><body><canvas id="world"></canvas><div id="hud"><div class="top"><div>MỘT ĐỜI NGƯỜI</div><div id="clock"></div></div><div class="chips"><span class="chip">Nguyễn Minh · 24</span><span class="chip" id="loc"></span><span class="chip" id="money"></span><span class="chip" id="energy"></span><span class="chip" id="stress"></span><span class="chip" id="rel"></span></div><div class="bottom" id="hint">WASD di chuyển · E tương tác · N +1 giờ · P lưu · L tải · R chơi lại</div></div><div class="toast" id="toast"></div><div class="controls"><button class="btn" id="hour">+1 giờ</button><button class="btn" id="save">Lưu</button><button class="btn" id="load">Tải</button></div><div class="modal" id="modal"><div class="card"><div class="meta" id="meta"></div><div class="text" id="story"></div><div class="choices" id="choices"></div></div></div><div class="error" id="error"><div class="box"><h2>Web MVP gặp lỗi khởi động</h2><p>Trang đã mở nhưng bộ mô phỏng không chạy.</p><pre id="errorText"></pre></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('world'),ctx=c.getContext('2d'),clock=$('clock'),loc=$('loc'),money=$('money'),energy=$('energy'),stress=$('stress'),rel=$('rel'),modal=$('modal'),meta=$('meta'),story=$('story'),choices=$('choices'),toastEl=$('toast');const DAYS=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];const state={day:1,min:462,money:15000000,energy:82,stress:18,confidence:52,trust:0,affection:0,understanding:0,closeness:0,respect:0,hurt:0,memories:[],done:[]};const player={x:-420,y:-240},keys=new Set();let paused=false,timer;const places=[['Nhà',-520,-330,220,150,'#71899a'],['Văn phòng',270,-330,280,170,'#627b8d'],['Quán cà phê',-520,240,190,140,'#96715b'],['Công viên',280,220,250,170,'#5f8060'],['Cửa hàng',-70,235,190,135,'#a9905e'],['Nhà hàng',-70,-340,190,135,'#875e5d']];const roads=[[-760,-70,1520,120],[-80,-620,160,1240]],linh={x:-430,y:300};const npcs=Array.from({length:18},()=>({x:-680+Math.random()*1360,y:-560+Math.random()*1120,vx:Math.random()-.5,vy:Math.random()-.5}));const scenes=[[1,'Nhà','Sáng Chủ nhật. Điện thoại nằm trên bàn. Minh không có kế hoạch rõ ràng.',[['Ở nhà nghỉ ngơi',{energy:6,stress:-3,m:'rested'}],['Đi ra ngoài',{energy:-3,m:'went_out'}]]],[1,'Quán cà phê','Quán cà phê không đông. Có những buổi sáng chẳng có chuyện gì đặc biệt.',[['Ngồi một mình',{energy:2,stress:-1,m:'quiet_cafe'}],['Mở lời',{energy:-2,confidence:2,m:'small_talk'}]]],[2,'Văn phòng','Một việc gấp xuất hiện đúng lúc Minh vừa định đóng máy.',[['Ở lại xử lý',{energy:-8,stress:5,m:'worked_late'}],['Để sáng mai',{stress:-2,m:'set_boundary'}]]],[2,'Nhà','Một tin nhắn của Linh xuất hiện. Chỉ là một câu hỏi rất bình thường.',[['Trả lời ngay',{energy:-1,trust:2,affection:2,m:'replied'}],['Để mai',{trust:-1,m:'delayed'}]]],[3,'Văn phòng','Đồng nghiệp rủ Minh đi ăn trưa. Cậu đã định ăn một mình.',[['Đi cùng',{energy:-4,confidence:1,m:'lunch'}],['Từ chối',{energy:2,m:'alone'}]]],[3,'Công viên','Công viên yên hơn thường lệ. Minh có thời gian nghĩ về tuần này.',[['Đi bộ',{energy:-2,stress:-5,m:'walk'}],['Về nhà',{energy:2,m:'home_early'}]]],[4,'Quán cà phê','Linh có vẻ mệt nhưng vẫn cố tỏ ra bình thường.',[['Hỏi thăm',{trust:2,understanding:3,affection:1,m:'noticed'}],['Không hỏi',{hurt:2,affection:-1,m:'missed_signal'}]]],[5,'Cửa hàng','Một khoản chi nhỏ cũng là một lựa chọn.',[['Mua thứ mình thích',{money:-80000,stress:-2,m:'small_treat'}],['Không mua',{confidence:1,m:'saved'}]]],[5,'Nhà hàng','Một lời mời ăn tối đến bất ngờ.',[['Đi ăn',{money:-180000,energy:-3,affection:2,closeness:2,m:'dinner'}],['Từ chối',{energy:2,trust:-1,m:'declined'}]]],[6,'Văn phòng','Cuối tuần đã gần tới nhưng một phần việc vẫn chưa xong.',[['Làm thêm',{energy:-5,stress:4,m:'overtime'}],['Đóng máy đúng giờ',{stress:-3,confidence:1,m:'protected_time'}]]],[6,'Quán cà phê','Linh hỏi: “Dạo này cậu ổn không?”',[['Nói thật một chút',{trust:4,understanding:4,closeness:2,confidence:2,m:'opened_up'}],['Nói “ổn mà”',{trust:-1,m:'kept_feelings'}]]],[7,'Nhà','Sáng thứ Bảy. Minh có thể dành cả ngày cho việc riêng.',[['Ngủ thêm',{energy:8,stress:-3,m:'slept'}],['Dọn phòng',{energy:-2,confidence:1,m:'cleaned'}]]],[7,'Công viên','Mỗi người trong công viên đều có một cuộc sống riêng. Minh cũng vậy.',[['Ngồi quan sát',{energy:2,stress:-3,understanding:1,m:'observed'}],['Đi bộ thật lâu',{energy:-5,stress:-6,m:'long_walk'}]]],[7,'Quán cà phê','Linh nhắn rằng hôm nay cô ấy rảnh. Không có kế hoạch đặc biệt nào.',[['Hẹn gặp',{energy:-3,affection:2,closeness:3,trust:2,m:'made_time'}],['Để dịp khác',{energy:2,trust:-2,m:'postponed'}]]],[7,'Nhà hàng','Bữa tối kết thúc. Có những mối quan hệ không cần một câu trả lời ngay lập tức.',[['Muốn tiếp tục tìm hiểu',{trust:3,affection:3,closeness:2,m:'said_continue'}],['Giữ như hiện tại',{m:'status_quo'}]]]];
function resize(){c.width=innerWidth;c.height=innerHeight}function clamp(v){return Math.max(0,Math.min(100,v))}function moneyFmt(v){return new Intl.NumberFormat('vi-VN').format(Math.round(v))+' ₫'}function time(){return String(Math.floor(state.min/60)%24).padStart(2,'0')+':'+String(Math.floor(state.min%60)).padStart(2,'0')}function place(){let best=['Đường phố',Infinity];for(const p of places){const d=Math.hypot(player.x-(p[1]+p[3]/2),player.y-(p[2]+p[4]/2));if(d<best[1])best=[p[0],d]}return best[1]<190?best[0]:'Đường phố'}function relationship(){return Math.round((state.trust+state.affection+state.understanding+state.closeness+state.respect)/5)}function hud(){clock.textContent=`${DAYS[state.day-1]} · ${time()}`;loc.textContent=place();money.textContent=moneyFmt(state.money);energy.textContent=`Năng lượng ${Math.round(state.energy)}`;stress.textContent=`Stress ${Math.round(state.stress)}`;rel.textContent=`Quan hệ ${relationship()}`}function toast(t){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>toastEl.classList.remove('on'),1800)}function openScene(s){if(!s)return toast('Ở đây chưa có sự kiện mới.');paused=true;meta.textContent=`${s[1]} · ${DAYS[state.day-1]} · ${time()}`;story.textContent=s[2];choices.innerHTML='';s[3].forEach(ch=>{const b=document.createElement('button');b.className='choice';b.textContent=ch[0];b.onclick=()=>choose(ch[1],s);choices.appendChild(b)});modal.style.display='grid'}function choose(e,s){for(const k of ['energy','stress','confidence'])if(e[k])state[k]=clamp(state[k]+e[k]);for(const k of ['trust','affection','understanding','closeness','respect','hurt'])if(e[k])state[k]=clamp(state[k]+e[k]);if(e.money)state.money=Math.max(0,state.money+e.money);if(e.m)state.memories.push({id:e.m,day:state.day,min:state.min});state.done.push(`${state.day}|${s[1]}`);state.min+=12;modal.style.display='none';paused=false;hud();toast('Lựa chọn đã được ghi nhớ.')}function interact(){const s=scenes.find(x=>x[0]===state.day&&x[1]===place()&&!state.done.includes(`${state.day}|${x[1]}`));if(s)return openScene(s);if(place()==='Quán cà phê'&&Math.hypot(player.x-linh.x,player.y-linh.y)<230)return openScene([state.day,'Quán cà phê','Linh nhìn Minh rồi mỉm cười nhẹ. Hôm nay cô ấy không vội.',[['Hỏi hôm nay thế nào',{trust:1,understanding:1,m:'asked'}],['Kể một chuyện nhỏ',{affection:1,closeness:1,m:'shared'}],['Để cô ấy nghỉ',{respect:1,m:'space'}]]]);toast('Ở đây chưa có sự kiện mới.')}function hour(){state.min+=60;state.energy=clamp(state.energy-1);if(state.min>=1440){state.min-=1440;state.day++;state.done=[];if(state.day>7){state.day=1;endWeek();return}}linh.x=state.day<=1?-430:state.day<=4?360:-420;linh.y=state.day<=1?300:-240;hud()}function endWeek(){paused=true;meta.textContent='KẾT THÚC TUẦN 01';let t='Một tuần bình thường.';if(state.trust>=60&&state.affection>=60&&state.closeness>=45)t='Một người đang trở nên quan trọng.';else if(state.trust<20||state.hurt>=30)t='Khoảng cách bắt đầu xuất hiện.';else if(state.stress>=70)t='Minh cần chậm lại.';story.textContent=t+' Không có đúng hay sai tuyệt đối. Chỉ có những lựa chọn đã trở thành một phần của cuộc sống.';choices.innerHTML='';const b=document.createElement('button');b.className='choice';b.textContent='Chơi lại từ đầu';b.onclick=()=>{localStorage.removeItem('motdoinguoi-final');location.reload()};choices.appendChild(b);modal.style.display='grid'}function save(){localStorage.setItem('motdoinguoi-final',JSON.stringify({state,player}));toast('Đã lưu cuộc sống của Minh.')}function load(){try{const d=JSON.parse(localStorage.getItem('motdoinguoi-final'));if(!d)return toast('Chưa có bản lưu.');Object.assign(state,d.state);Object.assign(player,d.player);hud();toast('Đã tải bản lưu.')}catch(e){toast('Không đọc được bản lưu.')}}function update(dt){if(!paused){let vx=(keys.has('d')?1:0)-(keys.has('a')?1:0),vy=(keys.has('s')?1:0)-(keys.has('w')?1:0);if(vx||vy){const q=Math.hypot(vx,vy);player.x+=vx/q*210*dt;player.y+=vy/q*210*dt;state.min+=dt*.6;hud()}}for(const n of npcs){n.x+=n.vx*35*dt;n.y+=n.vy*35*dt;if(Math.abs(n.x)>720||Math.abs(n.y)>600||Math.random()<.006){n.vx=Math.random()-.5;n.vy=Math.random()-.5}}}function draw(){ctx.fillStyle='#60725c';ctx.fillRect(0,0,c.width,c.height);const ox=player.x-c.width/2,oy=player.y-c.height/2,sx=v=>v-ox,sy=v=>v-oy;for(const r of roads){ctx.fillStyle='#30343a';ctx.fillRect(sx(r[0]),sy(r[1]),r[2],r[3])}ctx.strokeStyle='#d6c05b';ctx.lineWidth=3;ctx.setLineDash([20,20]);ctx.beginPath();ctx.moveTo(sx(-760),sy(-10));ctx.lineTo(sx(760),sy(-10));ctx.moveTo(sx(0),sy(-620));ctx.lineTo(sx(0),sy(620));ctx.stroke();ctx.setLineDash([]);for(const p of places){ctx.fillStyle=p[5];ctx.fillRect(sx(p[1]),sy(p[2]),p[3],p[4]);ctx.fillStyle='#071018c0';ctx.fillRect(sx(p[1]+8),sy(p[2]+8),Math.min(p[3]-16,190),26);ctx.fillStyle='#fff';ctx.font='700 13px system-ui';ctx.fillText(p[0],sx(p[1]+15),sy(p[2]+27))}for(const n of npcs){ctx.fillStyle='#687786';ctx.beginPath();ctx.arc(sx(n.x),sy(n.y),7,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#e0b08e';ctx.beginPath();ctx.arc(sx(linh.x),sy(linh.y),11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText('Linh',sx(linh.x-13),sy(linh.y-18));ctx.fillStyle='#2f3740';ctx.beginPath();ctx.arc(sx(player.x),sy(player.y),13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 12px system-ui';ctx.fillText('Minh',sx(player.x-15),sy(player.y-20));requestAnimationFrame(draw)}function boot(){resize();addEventListener('resize',resize);addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(k==='e')interact();if(k==='n')hour();if(k==='p')save();if(k==='l')load();if(k==='r'&&!paused)location.reload()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));$('hour').onclick=hour;$('save').onclick=save;$('load').onclick=load;hud();setInterval(()=>update(1/30),33);draw()}try{boot()}catch(e){$('errorText').textContent=e&&e.stack?e.stack:String(e);$('error').style.display='grid'}})();
</script></body></html>

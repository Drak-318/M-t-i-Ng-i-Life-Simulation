<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Một Đời Người — Web MVP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#91a8b7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 5px #000}.top{display:flex;justify-content:space-between;padding:16px 20px;font-size:14px;font-weight:700}.stats{display:flex;gap:8px;padding:0 20px;flex-wrap:wrap}.stats span,#hint{background:#081018aa;border-radius:8px;padding:7px 10px}.bottom{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);white-space:nowrap}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:end center;padding:30px;z-index:5}.card{width:min(760px,100%);background:#101820f5;color:#fff;border:1px solid #ffffff30;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0008}.card h3{margin:0 0 10px;font-size:13px;opacity:.65}.card p{font-size:19px;line-height:1.5;margin:0 0 18px}.choices{display:grid;gap:9px}.choices button{padding:13px;border-radius:10px;border:1px solid #ffffff25;background:#ffffff10;color:#fff;text-align:left;font-size:15px;cursor:pointer}.choices button:hover{background:#ffffff20}.hide{display:none}</style></head><body><canvas id="c"></canvas><div id="hud"><div class="top"><div>MỘT ĐỜI NGƯỜI</div><div id="clock"></div></div><div class="stats"><span>Nguyễn Minh · 24</span><span id="loc"></span><span id="money"></span><span id="energy"></span></div><div class="bottom" id="hint">WASD di chuyển · E tương tác · N +1 giờ · P lưu · L tải</div></div><script>(function(){'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),clock=document.getElementById('clock'),loc=document.getElementById('loc'),money=document.getElementById('money'),energy=document.getElementById('energy'),hint=document.getElementById('hint');function size(){c.width=innerWidth;c.height=innerHeight}size();addEventListener('resize',size);const days=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];const S={day:1,min:462,money:15000000,energy:82,stress:18,confidence:52,trust:0,completed:[],memories:[]};const places=[['Nhà',-520,-330,220,150,'#74899a'],['Văn phòng',270,-330,280,170,'#667f91'],['Quán cà phê',-520,240,190,140,'#98735d'],['Công viên',280,220,250,170,'#5f8060'],['Cửa hàng',-70,235,190,135,'#ae9560'],['Nhà hàng',-70,-340,190,135,'#895f5d']];const roads=[[-760,-70,1520,120],[-80,-620,160,1240]];const player={x:-420,y:-240};const linh={x:-430,y:300};const np=[];for(let i=0;i<18;i++)np.push({x:-650+Math.random()*1300,y:-560+Math.random()*1120,vx:Math.random()-.5,vy:Math.random()-.5});const keys={};let paused=false;function moneyFmt(v){return new Intl.NumberFormat('vi-VN').format(v)+' ₫'}function tm(){return String(Math.floor(S.min/60)%24).padStart(2,'0')+':'+String(S.min%60).padStart(2,'0')}function place(){let b='Đường phố',d=1e9;for(const p of places){const q=Math.hypot(player.x-(p[1]+p[3]/2),player.y-(p[2]+p[4]/2));if(q<d){d=q;b=p[0]}}return d<190?b:'Đường phố'}function hud(){clock.textContent=days[S.day-1]+' · '+tm();loc.textContent=place();money.textContent=moneyFmt(S.money);energy.textContent='Năng lượng '+S.energy}function clamp(v){return Math.max(0,Math.min(100,v))}function save(){localStorage.setItem('motdoinguoi-mvp',JSON.stringify(S));localStorage.setItem('motdoinguoi-player',JSON.stringify(player));flash('Đã lưu cuộc sống của Minh.')}function load(){try{const a=JSON.parse(localStorage.getItem('motdoinguoi-mvp')),b=JSON.parse(localStorage.getItem('motdoinguoi-player'));if(!a||!b)return flash('Chưa có bản lưu.');Object.assign(S,a);Object.assign(player,b);hud();flash('Đã tải bản lưu.')}catch(e){flash('Không đọc được bản lưu.')}}function flash(t){hint.textContent=t;setTimeout(()=>hint.textContent='WASD di chuyển · E tương tác · N +1 giờ · P lưu · L tải',1800)}const scenes=[{d:1,p:'Nhà',t:'Sáng Chủ nhật. Điện thoại nằm trên bàn. Minh không có kế hoạch rõ ràng.',a:[['Ở nhà nghỉ ngơi',5,-3],['Đi ra ngoài',-3,0]]},{d:1,p:'Quán cà phê',t:'Quán cà phê không đông. Có những buổi sáng chẳng có chuyện gì đặc biệt.',a:[['Ngồi một mình',2,0],['Mở lời',-1,0]]},{d:2,p:'Văn phòng',t:'Một việc gấp xuất hiện đúng lúc Minh vừa định đóng máy.',a:[['Ở lại xử lý',-8,5],['Để sáng mai',2,-2]]},{d:2,p:'Nhà',t:'Một tin nhắn của Linh xuất hiện nhưng không có nội dung gì quan trọng.',a:[['Trả lời',-1,0],['Để mai',0,1]]},{d:3,p:'Văn phòng',t:'Đồng nghiệp rủ Minh đi ăn trưa. Cậu đã định ăn một mình.',a:[['Đi cùng',-4,0],['Từ chối',2,0]]},{d:3,p:'Công viên',t:'Công viên yên hơn thường lệ. Minh có thời gian nghĩ về tuần này.',a:[['Đi bộ',-2,-5],['Về nhà',2,0]]},{d:4,p:'Văn phòng',t:'Một lỗi nhỏ trong công việc khiến Minh mất tự tin.',a:[['Sửa ngay',0,2],['Nhờ đồng nghiệp',0,-2]]},{d:4,p:'Quán cà phê',t:'Linh có vẻ mệt nhưng vẫn cố tỏ ra bình thường.',a:[['Hỏi thăm',0,-2],['Không hỏi',0,1]]},{d:5,p:'Nhà hàng',t:'Một lời mời ăn tối đến bất ngờ.',a:[['Đi ăn',-3,0],['Từ chối',2,0]]},{d:6,p:'Quán cà phê',t:'Linh hỏi: “Dạo này cậu ổn không?”',a:[['Nói thật',0,-4],['Nói ổn',0,1]]},{d:7,p:'Công viên',t:'Mỗi người trong công viên đều có một cuộc sống riêng.',a:[['Ngồi quan sát',0,-3],['Đi bộ',-2,-4]]},{d:7,p:'Nhà',t:'Một tuần đã trôi qua. Không có chiến thắng lớn. Cũng không có thất bại lớn.',a:[['Viết lại điều đáng nhớ',0,-3],['Đóng điện thoại',4,-2]]}];function scene(){const p=place();const s=scenes.find(q=>q.d===S.day&&q.p===p&&!S.completed.includes(q.d+'|'+q.p));if(!s)return flash('Ở đây chưa có sự kiện mới.');paused=true;const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card"><h3>'+s.p+' · '+days[S.day-1]+'</h3><p>'+s.t+'</p><div class="choices"></div></div>';document.body.appendChild(m);const box=m.querySelector('.choices');s.a.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a[0];b.onclick=()=>{S.energy=clamp(S.energy+a[1]);S.stress=clamp(S.stress+a[2]);if(a[0].includes('hỏi')||a[0].includes('thật'))S.confidence=clamp(S.confidence+2);if(s.p==='Quán cà phê'||s.p==='Nhà')S.trust+=a[0].includes('Trả')||a[0].includes('thật')?2:-1;S.min+=12;S.completed.push(s.d+'|'+s.p);S.memories.push({d:S.day,p:s.p});m.remove();paused=false;hud();flash('Lựa chọn đã được ghi nhớ.')}};box.appendChild(b)})}function hour(){S.min+=60;if(S.min>=1440){S.min-=1440;S.day++;if(S.day>7){S.day=1;S.completed=[];flash('Một tuần khép lại. Một tuần khác bắt đầu.')}}hud()}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;const k=e.key.toLowerCase();if(k==='e')scene();if(k==='n')hour();if(k==='p')save();if(k==='l')load()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function update(){if(!paused){let vx=(keys.d?1:0)-(keys.a?1:0),vy=(keys.s?1:0)-(keys.w?1:0);if(vx||vy){const q=Math.hypot(vx,vy);player.x+=vx/q*4;player.y+=vy/q*4;S.min+=.18;hud()}}for(const n of np){n.x+=n.vx;n.y+=n.vy;if(Math.abs(n.x)>700||Math.abs(n.y)>600||Math.random()<.01){n.vx=Math.random()-.5;n.vy=Math.random()-.5}}}function draw(){x.fillStyle='#60725c';x.fillRect(0,0,c.width,c.height);const ox=player.x-c.width/2,oy=player.y-c.height/2;const sx=q=>q-ox,sy=q=>q-oy;for(const r of roads){x.fillStyle='#30343a';x.fillRect(sx(r[0]),sy(r[1]),r[2],r[3])}for(const p of places){x.fillStyle=p[5];x.fillRect(sx(p[1]),sy(p[2]),p[3],p[4]);x.fillStyle='#101820bb';x.fillRect(sx(p[1]+8),sy(p[2]+8),Math.min(p[3]-16,180),26);x.fillStyle='#fff';x.font='bold 14px system-ui';x.fillText(p[0],sx(p[1]+15),sy(p[2]+27))}for(const n of np){x.fillStyle='#687786';x.beginPath();x.arc(sx(n.x),sy(n.y),7,0,7);x.fill()}x.fillStyle='#e0b08e';x.beginPath();x.arc(sx(linh.x),sy(linh.y),11,0,7);x.fill();x.fillStyle='#fff';x.font='12px system-ui';x.fillText('Linh',sx(linh.x-13),sy(linh.y-18));x.fillStyle='#2f3740';x.beginPath();x.arc(sx(player.x),sy(player.y),13,0,7);x.fill();x.fillStyle='#fff';x.font='bold 12px system-ui';x.fillText('Minh',sx(player.x-15),sy(player.y-19));requestAnimationFrame(draw)}hud();setInterval(update,16);draw()})()</script></body></html>

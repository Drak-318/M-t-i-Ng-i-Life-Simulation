<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Một Đời Người — Web MVP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10141a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;color:#fff}.topbar{display:flex;justify-content:space-between;padding:18px 22px 9px;font-size:14px;text-shadow:0 2px 8px #000}.brand{font-weight:800;letter-spacing:.14em}.statusbar{display:flex;gap:18px;padding:0 22px;font-size:13px}.statusbar span{padding:6px 9px;border-radius:8px;background:rgba(8,12,18,.34);backdrop-filter:blur(8px)}#hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 15px;border-radius:10px;background:rgba(8,12,18,.68);font-size:13px;white-space:nowrap}#interaction{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);padding:11px 15px;border-radius:9px;background:rgba(8,12,18,.82);font-size:14px}.hidden{display:none!important}#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#10141a;z-index:10;transition:opacity .35s}.done{opacity:0;pointer-events:none}#dialogue{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 20px 42px;background:linear-gradient(transparent,rgba(0,0,0,.45));z-index:20}.dialogue-card{width:min(760px,100%);padding:24px 26px 22px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(13,18,25,.94);backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.4);color:#fff}.speaker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin-bottom:10px}.dialogue-text{font-size:18px;line-height:1.55;margin-bottom:18px}.choices{display:grid;gap:9px}.choices button{border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:12px 14px;text-align:left;background:rgba(255,255,255,.06);color:#fff;font:inherit;cursor:pointer}.choices button:hover{background:rgba(255,255,255,.12)}@media(max-width:700px){.statusbar{gap:6px;font-size:10px;flex-wrap:wrap}#hint{width:calc(100% - 32px);text-align:center;white-space:normal}.dialogue-card{padding:18px}.dialogue-text{font-size:16px}}</style></head><body><div id="game"></div><div id="hud"><div class="topbar"><div class="brand">MỘT ĐỜI NGƯỜI</div><div id="clock">Chủ nhật · 07:42</div></div><div class="statusbar"><span>Nguyễn Minh · 24</span><span id="location">Nhà</span><span id="money">15.000.000 ₫</span></div><div id="hint">Đang tải...</div><div id="interaction" class="hidden"></div></div><div id="loading">Đang dựng khu phố...</div><script type="module" src="https://cdn.jsdelivr.net/gh/Drak-318/M-t-i-Ng-i-Life-Simulation@main/src/mvp-final.js"></script></body></html>

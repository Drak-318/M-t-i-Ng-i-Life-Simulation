<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Một Đời Người — Web MVP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10141a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;color:#fff}.topbar{display:flex;justify-content:space-between;padding:18px 22px 9px;font-size:14px;text-shadow:0 2px 8px #000}.brand{font-weight:800;letter-spacing:.14em}.statusbar{display:flex;gap:18px;padding:0 22px;font-size:13px}.statusbar span{padding:6px 9px;border-radius:8px;background:rgba(8,12,18,.38)}#hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 15px;border-radius:10px;background:rgba(8,12,18,.72);font-size:13px;white-space:nowrap}#interaction{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);padding:11px 15px;border-radius:9px;background:rgba(8,12,18,.82);font-size:14px}.hidden{display:none!important}#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#10141a;z-index:10;transition:opacity .35s}.done{opacity:0;pointer-events:none}@media(max-width:700px){.statusbar{gap:6px;font-size:10px;flex-wrap:wrap}#hint{width:calc(100% - 32px);text-align:center;white-space:normal}}</style></head><body><div id="game"></div><div id="hud"><div class="topbar"><div class="brand">MỘT ĐỜI NGƯỜI</div><div id="clock">Chủ nhật · 07:42</div></div><div class="statusbar"><span>Nguyễn Minh · 24</span><span id="location">Nhà</span><span id="money">15.000.000 ₫</span></div><div id="hint">WASD di chuyển · E tương tác · N tua 1 giờ · P lưu · L tải</div><div id="interaction" class="hidden"></div></div><div id="loading">Đang dựng khu phố...</div><script src="src/browser-mvp.js?v=20261103-3"></script></body></html>
